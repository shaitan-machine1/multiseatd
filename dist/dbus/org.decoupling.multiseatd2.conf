<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <!-- Capabilities, not caller UID, authorize context-local operations. -->
    <allow send_destination="org.decoupling.multiseatd2" send_interface="org.decoupling.multiseatd2.Manager"/>
    <allow send_destination="org.decoupling.multiseatd2" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.decoupling.multiseatd2" send_interface="org.freedesktop.DBus.Peer"/>
    <allow receive_sender="org.decoupling.multiseatd2"/>
    <deny receive_sender="org.decoupling.multiseatd2" eavesdrop="true"/>
    <deny receive_interface="org.decoupling.multiseatd2.Manager" receive_member="StateChanged"/>
  </policy>
  <policy user="root">
    <allow own="org.decoupling.multiseatd2"/>
    <allow receive_sender="org.decoupling.multiseatd2"/>
    <allow receive_interface="org.decoupling.multiseatd2.Manager" receive_member="StateChanged"/>
  </policy>
</busconfig>
