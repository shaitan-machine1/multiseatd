<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <!-- Each explicitly configured seat owns one name in this namespace. -->
    <deny own_prefix="org.SGLogin.Multiseatd1"/>
    <!-- Capabilities authorize context-local calls; root-only calls are also
         independently authenticated by the server, including on private buses. -->
    <allow send_destination_prefix="org.SGLogin.Multiseatd1" send_interface="org.SGLogin.Multiseatd1.Manager"/>
    <allow send_destination_prefix="org.SGLogin.Multiseatd1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination_prefix="org.SGLogin.Multiseatd1" send_interface="org.freedesktop.DBus.Peer"/>
    <deny receive_interface="org.SGLogin.Multiseatd1.Manager" receive_member="StateChanged"/>
  </policy>
  <policy user="root">
    <allow own_prefix="org.SGLogin.Multiseatd1"/>
    <allow receive_interface="org.SGLogin.Multiseatd1.Manager" receive_member="StateChanged"/>
  </policy>
</busconfig>
